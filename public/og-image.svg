<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="180" rx="500" ry="320" fill="url(#glow)"/>
  <ellipse cx="200" cy="500" rx="400" ry="260" fill="url(#glow)" opacity="0.6"/>

  <!-- Feather logo -->
  <g transform="translate(120,210)">
    <text font-family="Inter, system-ui, sans-serif" font-size="180">🪶</text>
  </g>

  <!-- Wordmark -->
  <text x="340" y="320" font-family="Inter, system-ui, sans-serif" font-size="140" font-weight="700" fill="#ffffff" letter-spacing="-4">Pensive</text>
  <text x="344" y="395" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="500" fill="#e9d5ff">Notes that never leave your device</text>

  <!-- Bottom badges -->
  <g transform="translate(120,520)" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#ddd6fe">
    <rect x="0" y="0" rx="20" ry="20" width="180" height="44" fill="#ffffff" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="20" y="29">🔒 100% Local</text>
    <rect x="200" y="0" rx="20" ry="20" width="200" height="44" fill="#ffffff" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="220" y="29">🎙️ Whisper STT</text>
    <rect x="420" y="0" rx="20" ry="20" width="220" height="44" fill="#ffffff" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="440" y="29">💬 RAG Chat (WebGPU)</text>
    <rect x="660" y="0" rx="20" ry="20" width="200" height="44" fill="#ffffff" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="680" y="29">🇮🇳 Made in India</text>
  </g>

  <!-- Top-right URL -->
  <text x="1140" y="60" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#c4b5fd" opacity="0.8">worksoffline.in / pensive</text>
</svg>
